<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Divya Shakti Motors</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header class="site" id="hdr"></header>
<main>
<section class="soft" style="min-height:70vh">
  <div class="wrap authbox">
    <h2 style="text-align:center">Owner login</h2>
    <p class="lead" style="text-align:center;margin-inline:auto">For the showroom owner only.</p>
    <div class="formcard">
      <form id="loginForm" novalidate>
        <div class="err" hidden></div>
        <label class="f"><span>Mobile number</span><input name="phone" type="tel" inputmode="numeric" autocomplete="username" required></label>
        <label class="f"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn btn-red" type="submit">Login</button>
      </form>
    </div>
  </div>
</section>
</main>
<footer class="site" id="ftr"></footer>
<div class="mbar" id="mbar"></div>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
