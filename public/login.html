<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Divya Shakti Motors</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header class="site" id="hdr"></header>
<main>
<section class="soft" style="min-height:70vh">
  <div class="wrap authbox">
    <h2 style="text-align:center" data-i18n="welcome">Welcome</h2>
    <p class="lead" style="text-align:center;margin-inline:auto" data-i18n="sub">Log in to track your requests and save your favourite bikes.</p>
    <div class="formcard">
      <div class="tabs">
        <button class="tab on" data-tab="login" data-i18n="t_login">Login</button>
        <button class="tab" data-tab="register" data-i18n="t_register">Create account</button>
      </div>
      <form id="loginForm" novalidate>
        <div class="err" hidden></div>
        <label class="f"><span data-i18n="f_phone"></span><input name="phone" type="tel" inputmode="numeric" autocomplete="username" required></label>
        <label class="f"><span data-i18n="f_pass">Password</span><input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn btn-red" type="submit" data-i18n="t_login">Login</button>
      </form>
      <form id="regForm" novalidate hidden>
        <div class="err" hidden></div>
        <label class="f"><span data-i18n="f_name"></span><input name="name" maxlength="80" autocomplete="name" required></label>
        <label class="f"><span data-i18n="f_phone"></span><input name="phone" type="tel" inputmode="numeric" autocomplete="username" required></label>
        <label class="f"><span data-i18n="f_email">Email (optional)</span><input name="email" type="email" autocomplete="email"></label>
        <label class="f"><span data-i18n="f_pass_new">Password (min 8 characters)</span><input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
        <button class="btn btn-red" type="submit" data-i18n="t_register">Create account</button>
      </form>
    </div>
  </div>
</section>
</main>
<footer class="site" id="ftr"></footer>
<div class="mbar" id="mbar"></div>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
