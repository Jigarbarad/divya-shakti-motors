<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | Divya Shakti Motors</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/site.css">
<style>
.stat-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:26px}
.sc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.sc b{display:block;font-size:1.9rem;line-height:1.1}
.sc small{color:var(--muted)}
.sc.hot b{color:var(--red)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.bar select,.bar input{width:auto;min-width:140px;padding:9px 12px}
.bar .grow{flex:1;min-width:180px}
.thumb{width:56px;height:42px;border-radius:8px;object-fit:cover;background:var(--soft);display:block}
.thumb.none{display:grid;place-items:center;font-size:.65rem;color:#8a909c}
td select{padding:6px 8px;width:auto}
.rowact{white-space:nowrap}.rowact .btn+.btn{margin-left:6px}
.grid2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.chk{display:flex;gap:18px;flex-wrap:wrap}
.chk label{display:flex;gap:6px;align-items:center;font-weight:600}
.chk input{width:auto}
.imgprev{max-height:120px;border-radius:10px;margin-top:8px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="site" id="hdr"></header>
<main>
<div class="pagehead plain"><div class="wrap" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
  <div><h1>Manage bikes</h1><p id="who"></p></div>
  <button class="btn btn-ghost btn-sm" id="logout">Log out</button>
</div></div>
<section style="padding-top:28px;min-height:70vh">
  <div class="wrap">
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="prod">Bikes</button>
      <button class="tab" data-tab="acct">Account</button>
    </div>
    <div id="view"></div>
  </div>
</section>
</main>
<footer class="site" id="ftr"></footer>
<div class="mbar" id="mbar"></div>
<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
